services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: volquetes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: volquetes
      POSTGRES_USER: volquetes
      POSTGRES_PASSWORD: volquetes123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
